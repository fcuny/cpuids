name: ingest

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run ingestion pipeline
        id: ingest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./cmd/cpuids-ingest

      - name: Open pull request with the diff
        if: steps.ingest.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="ingest/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name  "cpuids-ingest[bot]"
          git config user.email "cpuids-ingest@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/cpu_models.json sources.yaml .ingest/state.json
          git commit -m "data: refresh from upstream sources"
          git push origin "$branch"
          gh pr create \
            --title "data: refresh from upstream sources" \
            --body "Automated ingestion run. Review the diff before merging: a sharp change may be a parser regression rather than real upstream movement. The count-drop canary has already passed." \
            --label ingest
