name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Sanity-check the embedded dataset
        run: go test ./...

      - name: Build artifacts
        run: |
          mkdir -p dist
          cp data/cpu_models.json dist/cpu_models.json
          go run ./cmd/cpuids-sqlite -sql dist/cpu_models.sql -db dist/cpu_models.db
          ( cd dist && sha256sum cpu_models.* > SHA256SUMS )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/cpu_models.json dist/cpu_models.sql dist/cpu_models.db dist/SHA256SUMS
